<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#111215"/>
  <defs>
    <pattern id="grid-b" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2126" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid-b)"/>

  <!-- Design System Component Matrix / Modular Swiss Grid -->
  <g transform="translate(120, 70)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="140" height="90" fill="#181a1f" stroke="#2c2f36" stroke-width="1"/>
    <line x1="20" y1="25" x2="100" y2="25" stroke="#a5b4fc" stroke-width="2"/>
    <line x1="20" y1="45" x2="120" y2="45" stroke="#44474f" stroke-width="1.5"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#44474f" stroke-width="1.5"/>

    <!-- Column 2 -->
    <rect x="180" y="0" width="140" height="90" fill="#181a1f" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="195" y="20" width="50" height="20" fill="#a5b4fc" fill-opacity="0.2" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="195" y1="55" x2="295" y2="55" stroke="#e3e2e2" stroke-width="1.5"/>
    <line x1="195" y1="70" x2="260" y2="70" stroke="#44474f" stroke-width="1.5"/>

    <!-- Column 3 -->
    <rect x="360" y="0" width="140" height="90" fill="#181a1f" stroke="#2c2f36" stroke-width="1"/>
    <circle cx="430" cy="45" r="22" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Row 2 -->
    <rect x="0" y="120" width="500" height="110" fill="#15171c" stroke="#2c2f36" stroke-width="1"/>
    <line x1="30" y1="150" x2="250" y2="150" stroke="#e3e2e2" stroke-width="2"/>
    <line x1="30" y1="175" x2="450" y2="175" stroke="#44474f" stroke-width="1"/>
    <line x1="30" y1="195" x2="380" y2="195" stroke="#44474f" stroke-width="1"/>
  </g>

  <!-- Clean Editorial Typography Markers -->
  <text x="40" y="440" fill="#e3e2e2" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="-0.02em">PROJECT B // DESIGN SYSTEM &amp; TOOLING</text>
  <text x="40" y="465" fill="#76797e" font-family="monospace" font-size="12" letter-spacing="0.05em">TOKEN ARCHITECTURE — REACT + RADIX PRIMITIVES</text>
</svg>
