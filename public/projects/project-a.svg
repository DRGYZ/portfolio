<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#121316"/>
  <!-- Hairline Grid -->
  <defs>
    <pattern id="grid-a" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222428" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9c3ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid-a)"/>
  
  <!-- Architectural Wireframe Polygon Mesh -->
  <g transform="translate(100, 60)">
    <polygon points="300,40 500,120 420,280 200,240" fill="url(#grad-a)" stroke="#b9c3ff" stroke-width="1.5"/>
    <polygon points="120,160 300,40 200,240" fill="none" stroke="#7986cb" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="500,120 540,240 420,280" fill="none" stroke="#7986cb" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="300" cy="40" r="4" fill="#b9c3ff"/>
    <circle cx="500" cy="120" r="4" fill="#b9c3ff"/>
    <circle cx="420" cy="280" r="4" fill="#b9c3ff"/>
    <circle cx="200" cy="240" r="4" fill="#b9c3ff"/>
    <circle cx="120" cy="160" r="3" fill="#7986cb"/>
    <circle cx="540" cy="240" r="3" fill="#7986cb"/>
  </g>

  <!-- Clean Editorial Typography Markers -->
  <text x="40" y="440" fill="#e3e2e2" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="-0.02em">PROJECT A // INTERACTIVE EXPERIENCE</text>
  <text x="40" y="465" fill="#76797e" font-family="monospace" font-size="12" letter-spacing="0.05em">SPECIMEN PREVIEW — NEXT.JS + MOTION + SHADER ARCHITECTURE</text>
</svg>
