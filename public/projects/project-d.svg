<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#131416"/>
  
  <!-- Editorial Column Layout Specimen -->
  <g transform="translate(100, 70)">
    <!-- Column 1 -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="#b9c3ff" stroke-width="3"/>
    <rect x="0" y="20" width="160" height="80" fill="#1b1c20" stroke="#2c2e36" stroke-width="1"/>
    <line x1="0" y1="120" x2="160" y2="120" stroke="#4a4d56" stroke-width="1"/>
    <line x1="0" y1="140" x2="130" y2="140" stroke="#4a4d56" stroke-width="1"/>
    <line x1="0" y1="160" x2="150" y2="160" stroke="#4a4d56" stroke-width="1"/>

    <!-- Column 2 (Wide Editorial Spread) -->
    <line x1="200" y1="0" x2="560" y2="0" stroke="#3d404a" stroke-width="1"/>
    <text x="200" y="45" fill="#e3e2e2" font-family="serif" font-style="italic" font-size="34">The Editorial Canvas</text>
    <line x1="200" y1="75" x2="560" y2="75" stroke="#2c2e36" stroke-width="1"/>
    <rect x="200" y="95" width="360" height="130" fill="#191a1e" stroke="#b9c3ff" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="230" y1="140" x2="530" y2="140" stroke="#e3e2e2" stroke-width="1.5"/>
    <line x1="230" y1="165" x2="480" y2="165" stroke="#767982" stroke-width="1"/>
    <line x1="230" y1="185" x2="430" y2="185" stroke="#767982" stroke-width="1"/>
  </g>

  <!-- Clean Editorial Typography Markers -->
  <text x="40" y="440" fill="#e3e2e2" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="-0.02em">PROJECT D // EDITORIAL PRODUCT</text>
  <text x="40" y="465" fill="#76797e" font-family="monospace" font-size="12" letter-spacing="0.05em">RESPONSIVE EDITORIAL FRAMEWORK — NEXT.JS + TYPOGRAPHY</text>
</svg>
